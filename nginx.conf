events { worker_connections 2048; }

http {
    # Paramètres de stabilité globale
    keepalive_timeout 3600;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    # --- PREMIÈRE VPS (PORT 8080) ---
    server {
        listen 8080;

        location /vps1/vless-ws {
            proxy_pass http://169.58.232.36:10001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            tcp_nodelay on;
        }

        location /trojan-ws {
            proxy_pass http://169.58.232.36:10002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            tcp_nodelay on;
        }

        location /vmess-ws {
            proxy_pass http://169.58.232.36:10003;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            tcp_nodelay on;
        }

        location /shadow-ws {
            proxy_pass http://169.58.232.36:10004;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            tcp_nodelay on;
        }
    }

    # --- SECONDE VPS SUR PORT 8080 REDIRIGEANT VERS LE PORT 443 DE LA SECONDE IP ---
    server {
        listen 8080;

        location /vps2/vless-ws {
            proxy_pass https://217.217.225.14:443;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            tcp_nodelay on;
        }

        location /vps2/trojan-ws {
            proxy_pass https://217.217.225.14:443;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            tcp_nodelay on;
        }

        location /vps2/vmess-ws {
            proxy_pass https://217.217.225.14:443;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            tcp_nodelay on;
        }

        location /vps2/shadow-ws {
            proxy_pass https://217.217.225.14:443;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            tcp_nodelay on;
        }
    }
}
