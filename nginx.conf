worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    keepalive_timeout 3600;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    tcp_nodelay on;
    tcp_nopush on;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_max_temp_file_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;

        location = / {
            default_type text/plain;
            return 200 "NOSTRA Proxy Online\n";
        }

        # PREMIER VPS (79.133.42.185)
        location /vps1/vless-ws {
            proxy_pass http://79.133.42.185:10001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_buffering off;
        }

        location /vps1/vmess-ws {
            proxy_pass http://79.133.42.185:10003;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_buffering off;
        }

        location /vps1/trojan-ws {
            proxy_pass http://79.133.42.185:18000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_buffering off;
        }

        location /vps1/socks {
            proxy_pass http://79.133.42.185:2004;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_buffering off;
        }

        # SECOND VPS (191.96.235.32)
