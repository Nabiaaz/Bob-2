events {
    worker_connections 2048;
}

http {
    # Paramètres de stabilité globale et de fluidité des flux
    keepalive_timeout 3600;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    tcp_nodelay on;
    tcp_nopush on;

    server {
        listen 8080;

        # Page d'accueil de vérification (équivalent de "NOSTRA Proxy Online")
        location = / {
            default_type text/plain;
            return 200 "NOSTRA Proxy Online\n";
        }

        # ==========================================
        # PREMIER VPS (79.133.42.185)
        # ==========================================
        location /vps1/vless-ws {
            proxy_pass http://79.133.42.185:10001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
        }

        location /vps1/vmess-ws {
            proxy_pass http://79.133.42.185:10003;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
